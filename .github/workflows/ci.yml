name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.11 .venv && uv pip install -p .venv/bin/python -e ".[dev]"
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: .venv/bin/pytest -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.1 build-tools;36.0.0"
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
