[project]
name = "frankino"
version = "2.0.0"
description = "Un compagno vocale con schermo: Claude Code dietro, un tablet Android davanti."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2.180",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "openai>=1.60",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
mac = ["sounddevice>=0.5", "numpy>=1.26", "websockets>=13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frankino"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
